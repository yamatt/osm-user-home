name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Svelte check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte diagnostics
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
